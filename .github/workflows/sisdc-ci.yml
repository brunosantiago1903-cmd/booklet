name: SISDC CI

on:
  push:
    branches: ["**"]
    paths:
      - "sisdc/**"
      - ".github/workflows/sisdc-ci.yml"
  pull_request:
    paths:
      - "sisdc/**"
      - ".github/workflows/sisdc-ci.yml"

concurrency:
  group: sisdc-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sisdc

jobs:
  lint:
    name: Pint (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (check only)
        run: vendor/bin/pint --test

  test:
    name: PHPUnit (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sisdc
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sisdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisdc -d sisdc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sisdc_test
      DB_USERNAME: sisdc
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, gd, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
