# Stack de PRODUÇÃO do SISDC (nginx + php-fpm + PostGIS).
#
# Defina os segredos em um arquivo .env ao lado deste compose (NÃO versione):
#   APP_KEY=base64:...            (php artisan key:generate --show)
#   APP_URL=https://defesacivil.morretes.pr.gov.br
#   DB_PASSWORD=<senha-forte>
#   SESSION_DOMAIN=defesacivil.morretes.pr.gov.br
#   SANCTUM_STATEFUL_DOMAINS=defesacivil.morretes.pr.gov.br
#
# Subir:   docker compose -f docker-compose.prod.yml up -d --build
# Admin:   docker compose -f docker-compose.prod.yml exec app php artisan sisdc:usuario
#
# Exponha a porta 8080 via Cloudflare Tunnel (TLS terminado no Cloudflare).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sisdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_DATABASE:-sisdc}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sisdc} -d ${DB_DATABASE:-sisdc}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "SISDC Morretes"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?defina APP_KEY no .env}
      APP_URL: ${APP_URL:-https://localhost}
      APP_LOCALE: pt_BR
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sisdc}
      DB_USERNAME: ${DB_USERNAME:-sisdc}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  dbdata:
